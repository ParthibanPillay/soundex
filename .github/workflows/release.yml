name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, out: soundex-linux-x64, bin: soundex }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, out: soundex-windows-x64.exe, bin: soundex.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.out }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r ../soundex-extension.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: soundex-extension.zip
